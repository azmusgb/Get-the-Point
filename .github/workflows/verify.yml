name: Verify release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser JavaScript
        run: |
          node --check play.js
          node --check play-runtime.js
          node --check playtest-enhancements.js
          node --check play-smart-card.js
          node --check public-demo.js
          node --check site-nav.js
          node --check diagnostics.js
          node --check analysis.js
          node --check demo-access.js
          node --check sw.js
          node --check scripts/verify-production.mjs
      - name: Verify product and release invariants
        run: node scripts/verify-release.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser-test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium + WebKit runtimes
        run: npx playwright install --with-deps chromium webkit
      - name: Run DECISIONS, DECISIONS browser acceptance matrix
        run: npx playwright test --config=playwright.config.mjs
      - name: Preserve browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Netlify production contract
        env:
          PRODUCTION_BASE_URL: https://get-the-point.netlify.app
          PRODUCTION_SMOKE_ATTEMPTS: '12'
          PRODUCTION_SMOKE_RETRY_MS: '5000'
        run: node scripts/verify-production.mjs
